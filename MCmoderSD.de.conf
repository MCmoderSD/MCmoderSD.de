<Virtualhost *:80>

        ServerName mcmodersd.de
        DocumentRoot /var/www/MCmoderSD.de

# SSL
        Redirect / https://mcmodersd.de
        #SSLEngine on
        #SSLCertificateFile     /etc/letsencrypt/live/mcmodersd.de/fullchain.pem
        #SSLCertificateKeyFile  /etc/letsencrypt/live/mcmodersd.de/privkey.pem

        <Directory /var/www/html>
            AllowOverride All
            Require all granted
        </Directory>

        <IfModule mod_rewrite.c>
            RewriteEngine On

            # Define RewriteMap for lowercase conversion
            RewriteMap tolower int:tolower

            # Condition: Check for uppercase letters
            RewriteCond %{REQUEST_URI} [A-Z]

            # Rule: Convert to lowercase
            RewriteRule (.*) ${tolower:$1} [R=301,L]
        </IfModule>

</Virtualhost>

<Virtualhost *:443>

        ServerName mcmodersd.de
        DocumentRoot /var/www/MCmoderSD.de

# SSL
        #Redirect / https://mcmodersd.de
        SSLEngine on
        SSLCertificateFile     /etc/letsencrypt/live/mcmodersd.de/fullchain.pem
        SSLCertificateKeyFile  /etc/letsencrypt/live/mcmodersd.de/privkey.pem

        <Directory /var/www/html>
            AllowOverride All
            Require all granted
        </Directory>

        <IfModule mod_rewrite.c>
            RewriteEngine On

            # Define RewriteMap for lowercase conversion
            RewriteMap tolower int:tolower

            # Condition: Check for uppercase letters
            RewriteCond %{REQUEST_URI} [A-Z]

            # Rule: Convert to lowercase
            RewriteRule (.*) ${tolower:$1} [R=301,L]
        </IfModule>

