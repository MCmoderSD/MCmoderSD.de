worker_processes auto;
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    server {
        listen 80;
        listen 443 ssl;

        server_name localhost;

        ssl_certificate /etc/ssl/cert.pem;
        ssl_certificate_key /etc/ssl/key.pem;

        root /var/www/html;
        index index.php;

        location / {
            try_files $uri $uri/ =404;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # Error pages
        error_page 400 /errors/400.php;
        error_page 403 /errors/403.php;
        error_page 404 /errors/404.php;
        error_page 408 /errors/408.php;
        error_page 500 /errors/500.php;
        error_page 502 /errors/502.php;
        error_page 503 /errors/503.php;
        error_page 504 /errors/504.php;
    }
}