name: Build and Push

on:
  workflow_dispatch:
  push:
    branches:
      - MCmoderSD.de

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        id: checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3.10.0

      - name: Log in to Docker Hub
        id: login
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Multi-arch Docker Image
        id: build-push
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mcmodersd.de:latest
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7,linux/arm/v6,linux/386,linux/ppc64le,linux/riscv64,linux/s390x
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/mcmodersd.de:latest
          cache-to: type=inline