services:
  webserver:
    container_name: Webserver
    image: mcmodersd/mcmodersd.de:angular-latest
    restart: unless-stopped
    pull_policy: always
    init: true
    ports:
      - "4000:4000/tcp"
    security_opt:
      - no-new-privileges:true

networks:
  default:
    name: Webserver-Network