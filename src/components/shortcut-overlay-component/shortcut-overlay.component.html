<nav class="shortcut-overlay" aria-label="Schnellzugriffe">
  @for (shortcut of shortcuts; track shortcut.name) {
    <a
      class="shortcut-overlay__link"
      [href]="shortcut.link"
      target="_blank"
      rel="noopener"
      [attr.aria-label]="shortcut.name + ' in neuem Tab öffnen'"
      [attr.title]="shortcut.name"
    >
      <app-service-icon [icon]="shortcut.icon" [size]="size.Small" />
    </a>
  }
</nav>
