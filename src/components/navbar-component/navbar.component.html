<nav class="navbar" aria-label="Main navigation">
  <a class="navbar__brand" routerLink="/">MCmoderSD.de</a>

  <span class="navbar__divider" aria-hidden="true"></span>

  <div class="navbar__links" #list>
    @if (pill(); as bounds) {
      <span
        class="navbar__pill"
        [style.transform]="'translateX(' + bounds.left + 'px)'"
        [style.width.px]="bounds.width"
        aria-hidden="true"
      ></span>
    }

    @for (link of links; track link.path; let index = $index) {
      <a
        #linkElement
        class="navbar__link"
        [class.navbar__link--active]="index === activeIndex()"
        [routerLink]="link.path"
        [attr.aria-current]="index === activeIndex() ? 'page' : null"
      >{{ link.label }}</a>
    }
  </div>
</nav>
