<nav class="navbar" aria-label="Main navigation">
  <a class="navbar__brand" routerLink="/">MCmoderSD.de</a>

  <span class="navbar__divider" aria-hidden="true"></span>

  <div
    class="navbar__links"
    #list
    (mouseleave)="hoveredIndex.set(-1)"
    (focusout)="clearHoverOnLeave($event)"
  >
    @if (pill(); as bounds) {
      <span
        class="navbar__pill"
        [style.transform]="'translateX(' + bounds.left + 'px)'"
        [style.width.px]="bounds.width"
        aria-hidden="true"
      ></span>
    }

    @for (link of links; track link.path; let index = $index) {
      <a
        #linkElement
        class="navbar__link"
        [class.navbar__link--highlight]="index === highlightIndex()"
        [routerLink]="link.path"
        [attr.aria-current]="index === activeIndex() ? 'page' : null"
        (mouseenter)="hoveredIndex.set(index)"
        (focusin)="hoveredIndex.set(index)"
      >{{ link.label }}</a>
    }
  </div>
</nav>
