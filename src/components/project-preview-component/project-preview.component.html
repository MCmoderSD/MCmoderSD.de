<article class="project-preview">
  <button
    type="button"
    class="project-preview__trigger"
    aria-label="View details for {{ data().name }}"
    (click)="openDetails()"
  ></button>

  <header class="project-preview__header">
    <h3 class="project-preview__name">{{ data().name }}</h3>
    <a
      class="project-preview__github"
      [href]="data().github"
      target="_blank"
      rel="noopener"
      aria-label="View {{ data().name }} on GitHub"
    >
      <i class="devicon-github-plain" aria-hidden="true"></i>
    </a>
  </header>

  <p class="project-preview__description">{{ data().description }}</p>

  <div class="project-preview__tools">
    @for (tool of data().tools; track tool) {
      <app-tool-icon [tool]="tool" [size]="size.Small" />
    }
  </div>
</article>
