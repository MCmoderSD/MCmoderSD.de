<img
  class="service-icon"
  [class.service-icon--on-dark]="lightSrc() !== null"
  [ngSrc]="src()"
  [width]="pixels()"
  [height]="pixels()"
  [title]="preset().name"
  alt=""
  loading="eager"
/>

@if (lightSrc(); as lightSrc) {
  <img
    class="service-icon service-icon--on-light"
    [ngSrc]="lightSrc"
    [width]="pixels()"
    [height]="pixels()"
    [title]="preset().name"
    alt=""
    loading="eager"
  />
}
