<img
  class="service-icon"
  [class.service-icon--on-dark]="lightSrc() !== null"
  [src]="src()"
  [title]="preset().name"
  alt=""
  decoding="async"
/>

@if (lightSrc(); as lightSrc) {
  <img
    class="service-icon service-icon--on-light"
    [src]="lightSrc"
    [title]="preset().name"
    alt=""
    decoding="async"
  />
}
