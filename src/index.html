<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MCmoderSD.de</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="MCmoderSD.de – Portfolio and projects of MCmoderSD, showcasing software development work, tools, and open-source contributions."
    />
    <!--
      Runs before the first paint, which is the whole point of it being inline and in <head>.
      The prerendered HTML is always the dark tier, so a visitor who chose light would otherwise
      watch the dark palette flash by until Angular hydrates and the switch reapplies it.
      Key and value are shared with color-scheme-switch.component.ts.
    -->
    <script>
      try {
        if (localStorage.getItem('color-scheme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {
        // Storage can be blocked outright (privacy modes, third-party contexts). Dark is the
        // default anyway, so there is nothing to recover from here.
      }
    </script>

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      No preconnect for fonts.googleapis.com: the build inlines the Google Fonts CSS, so that
      origin is never requested at runtime. gstatic still serves the woff2, jsdelivr the icons.
    -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
    <!-- Pinned: "@latest" caps the CDN cache at 7 days and lets upstream releases move class names. -->
    <link href="https://cdn.jsdelivr.net/npm/devicon@2.17.0/devicon.min.css" rel="stylesheet" />

    <script type="application/ld+json">

        "@context": "https://schema.org",

        "email": "mailto:business@mcmodersd.de",
        "sameAs": [
          "https://github.com/MCmoderSD",
          "https://www.linkedin.com/in/seraphin-berger/"
        ]
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
