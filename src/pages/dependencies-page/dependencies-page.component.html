<section class="dependencies-page">
  <div class="dependencies-page__intro">
    <div class="dependencies-page__text">
      <h1>Dependencies</h1>
      <p>
        These are my own Java packages. I develop and maintain them myself, hosting them on my own
        Nexus repository instead of Maven Central.
      </p>
    </div>

    <div class="dependencies-page__repo">
      <app-code-snippet [code]="repositorySnippet" language="pom.xml" />
    </div>
  </div>

  <div class="dependencies-page__grid">
    @for (dependency of dependencies; track dependency.data.name) {
      <app-dependency-preview [data]="dependency.data" [coordinates]="dependency.coordinates" />
    }
  </div>
</section>
